<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LAMRIN TECH SKILLS UNIVERSITY Student Sign Up</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0066cc, #00ccff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .signup-box {
      background-color: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
      width: 420px;
      text-align: center;
    }
    .signup-box img {
      width: 90px; /* adjust logo size */
      margin-bottom: 15px;
    }
    .signup-box h2 {
      color: #0066cc;
      margin-bottom: 25px;
    }
    .signup-box input[type="text"],
    .signup-box input[type="email"],
    .signup-box input[type="password"],
    .signup-box textarea,
    .signup-box select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .gender-options {
      margin: 10px 0;
      font-size: 14px;
      text-align: left;
    }
    .gender-options label {
      margin-right: 15px;
    }
    .signup-box button {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .signup-box button:hover {
      background-color: #00ccff;
    }
    .login-link {
      text-align: center;
      margin-top: 15px;
    }
    .login-link a {
      color: #0066cc;
      text-decoration: none;
      font-size: 14px;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <!-- University Logo -->
    <img src="C:\Users\HP\OneDrive\Pictures\Screenshots\Screenshot (160).png" alt="University Logo">
    <h2>LAMRIN TECH SKILLS UNIVERSITY Student Sign Up</h2>
    <form action="signup_process.php" method="post">
      <input type="text" name="fullname" placeholder="Full Name" required>
      <input type="text" name="studentid" placeholder="Student ID" required>
      <input type="email" name="email" placeholder="Email Address" required>
      
      <!-- Address -->
      <textarea name="address" placeholder="Residential Address" rows="3" required></textarea>
      
      <!-- Course Stream -->
      <select name="course_stream" required>
        <option value="">Select Course Stream</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Electronics">Electronics</option>
        <option value="Mechanical">Mechanical</option>
        <option value="Civil">Civil</option>
        <option value="Commerce">Commerce</option>
        <option value="Arts">Arts</option>
      </select>
      
      <!-- Semester Choice -->
      <select name="semester" required>
        <option value="">Select Semester</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
        <option value="7">Semester 7</option>
        <option value="8">Semester 8</option>
      </select>
      
      <!-- Gender -->
      <div class="gender-options">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
      </div>
      
      <input type="password" name="password" placeholder="Create Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      
      <button type="submit">Sign Up</button>
      <div class="login-link">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </form>
  </div>
</body>
</html>
