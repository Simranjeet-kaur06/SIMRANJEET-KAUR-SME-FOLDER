<!DOCTYPE html>
<html>
<head>
  <title>Even and Odd Numbers</title>
</head>
<body>
  <h2>Even and Odd Numbers between 1 to 100</h2>
  <div id="output"></div>

  <script>
    let result = "";
    for (let i = 1; i <= 100; i++) {
      if (i % 2 === 0) {
        result += "Even no: " + i + "<br>";
      } else {
        result += "Odd no: " + i + "<br>";
      }
    }
    document.getElementById("output").innerHTML = result;
  </script>
</body>
</html>
