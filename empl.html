<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Dashboard</title>
  <style>
    /* === Global Reset === */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f6fb; color: #24324a; }

    /* === Sidebar === */
    .sidebar {
      width: 230px; height: 100vh; background: #172554; color: white;
      position: fixed; padding: 30px 20px; transition: 0.3s;
    }
    .sidebar h2 { margin-bottom: 40px; color: #93c5fd; }
    .sidebar p {
      padding: 14px; margin-bottom: 10px; border-radius: 8px;
      cursor: pointer; transition: background 0.3s;
    }
    .sidebar p:first-of-type, .sidebar p:hover { background: #2d4077; }

    /* === Main Content === */
    .main { margin-left: 230px; padding: 30px; }
    header { margin-bottom: 30px; }
    header h1 { margin-bottom: 10px; font-size: 28px; }
    header p { color: #718096; }

    /* === Cards === */
    .cards {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 20px; margin-bottom: 30px;
    }
    .card {
      background: white; padding: 25px; border-radius: 12px;
      box-shadow: 0 3px 12px #dfe5ef; transition: transform 0.3s;
    }
    .card:hover { transform: translateY(-5px); }
    .card h3 { color: #718096; font-size: 15px; margin-bottom: 15px; }
    .card h2 { color: #2563eb; font-size: 26px; }

    /* === Employee Section === */
    .employee-section {
      background: white; padding: 25px; border-radius: 12px;
      box-shadow: 0 3px 12px #dfe5ef; overflow-x: auto;
    }
    .section-heading {
      display: flex; justify-content: space-between;
      align-items: center; gap: 15px; margin-bottom: 25px;
    }

    /* === Employee Form === */
    #employee-form {
      margin-bottom: 20px; padding: 15px; background: #f3f6fb;
      border-radius: 8px; display: flex; flex-wrap: wrap;
    }
    #employee-form input { margin: 5px; flex: 1; }

    /* === Inputs & Select === */
    input, select {
      padding: 11px; border: 1px solid #cbd5e1; border-radius: 7px;
      margin: 5px; outline: none; transition: 0.3s;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 5px #93c5fd; }

    /* === Buttons === */
    button {
      padding: 10px 16px; background: #2563eb; color: white;
      border: none; border-radius: 7px; cursor: pointer;
      font-size: 14px; margin: 3px; transition: 0.3s;
    }
    button:hover { background: #1e40af; transform: translateY(-2px); }

    /* === Employee Table === */
    table {
      width: 100%; border-collapse: collapse; background: white; text-align: left;
    }
    th { background: #172554; color: white; }
    td, th { padding: 14px; border-bottom: 1px solid #e5e7eb; }
    tbody tr:hover { background: #f8fafc; }

    /* === Responsive Layout === */
    @media (max-width: 600px) {
      .main { padding: 12px; }
      .employee-section { overflow-x: auto; }
      table { min-width: 600px; }
    }
    @media (max-width: 800px) {
      .sidebar { width: 100%; height: auto; position: static; }
      .sidebar h2 { margin-bottom: 15px; }
      .main { margin-left: 0; padding: 18px; }
      .cards { grid-template-columns: 1fr; }
      .section-heading { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Dashboard</h2>
    <p>Home</p>
    <p>Employees</p>
    <p>Departments</p>
    <p>Settings</p>
  </div>

  <!-- Main Content -->
  <div class="main">
    <header>
      <h1>Employee Management</h1>
      <p>Manage employee records and departments</p>
    </header>

    <!-- Cards -->
    <div class="cards">
      <div class="card">
        <h3>Total Employees</h3>
        <h2 id="total-employees">0</h2>
      </div>
      <div class="card">
        <h3>Departments</h3>
        <h2 id="total-departments">0</h2>
      </div>
      <div class="card">
        <h3>Active Projects</h3>
        <h2>5</h2>
      </div>
    </div>

    <!-- Employee Section -->
    <div class="employee-section">
      <div class="section-heading">
        <h2>Employee List</h2>
        <input type="text" id="search" placeholder="Search employee...">
      </div>

      <!-- Employee Form -->
      <form id="employee-form">
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="department" placeholder="Department" required>
        <button type="submit">Add Employee</button>
      </form>

      <!-- Employee Table -->
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Department</th>
          </tr>
        </thead>
        <tbody id="employee-table">
          <!-- Rows will be added dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const form = document.getElementById('employee-form');
    const table = document.getElementById('employee-table');
    const search = document.getElementById('search');
    const totalEmployees = document.getElementById('total-employees');
    const totalDepartments = document.getElementById('total-departments');

    let employees = [];

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const department = document.getElementById('department').value;

      employees.push({ name, department });
      updateTable();
      form.reset();
    });

    search.addEventListener('input', function() {
      updateTable(this.value);
    });

    function updateTable(filter = '') {
      table.innerHTML = '';
      let filtered = employees.filter(emp =>
        emp.name.toLowerCase().includes(filter.toLowerCase()) ||
        emp.department.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach(emp => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${emp.name}</td><td>${emp.department}</td>`;
        table.appendChild(row);
      });

      totalEmployees.textContent = employees.length;
      let uniqueDepartments = [...new Set(employees.map(emp => emp.department))];
      totalDepartments.textContent = uniqueDepartments.length;
    }
  </script>

</body>
</html>
