<!DOCTYPE html>
<html>
<body>
<h2>Day of the Week</h2>

<input type="number" id="day" placeholder="Enter 1 to 7">
<button onclick="checkDay()">Check Day</button>
<p id="result"></p>

<script>
function checkDay() {
    let d = Number(document.getElementById("day").value);
    let dayName;

    switch (d) {
        case 1: dayName = "Monday"; break;
        case 2: dayName = "Tuesday"; break;
        case 3: dayName = "Wednesday"; break;
        case 4: dayName = "Thursday"; break;
        case 5: dayName = "Friday"; break;
        case 6: dayName = "Saturday"; break;
        case 7: dayName = "Sunday"; break;
        default: dayName = "Invalid day. Enter 1 to 7";
    }

    document.getElementById("result").innerHTML = dayName;
}
</script>
</body>
</html>
