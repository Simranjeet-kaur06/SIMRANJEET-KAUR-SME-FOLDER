<!DOCTYPE html>
<html>
<body>
<h2>Positive or Negative</h2>

<input type="number" id="num" placeholder="Enter a number">
<button onclick="check()">Check</button>
<p id="result"></p>

<script>
function check() {
    let n = Number(document.getElementById("num").value);

    if (document.getElementById("num").value === "") {
        document.getElementById("result").innerHTML = "Enter a number";
    }
    else if (n > 0) {
        document.getElementById("result").innerHTML = "Positive Number";
    }
    else if (n < 0) {
        document.getElementById("result").innerHTML = "Negative Number";
    }
    else {
        document.getElementById("result").innerHTML = "Zero";
    }
}
</script>
</body>
</html>
