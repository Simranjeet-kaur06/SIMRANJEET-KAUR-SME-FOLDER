<!DOCTYPE html>
<html>
<head>
  <title>Sum of First 100 Numbers</title>
</head>
<body>
  <h3>Sum of First 100 Numbers</h3>
  <button onclick="sumNumbers()">Calculate</button>
  <p id="result"></p>

  <script>
    function sumNumbers() {
      let sum = 0;
      for (let i = 1; i <= 100; i++) {   // using for loop
        sum = sum + i;
      }
      document.getElementById("result").innerText = "Sum = " + sum;
    }
  </script>
</body>
</html>
