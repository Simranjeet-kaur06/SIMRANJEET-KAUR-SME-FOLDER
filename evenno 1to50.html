<!DOCTYPE html>
<html>
<head>
  <title>Sum of Even Numbers</title>
</head>
<body>
  <h3>Sum of Even Numbers (1 to 50)</h3>
  <button onclick="sumEven()">Calculate</button>
  <p id="result"></p>

  <script>
    function sumEven() {
      let sum = 0;
      for (let i = 2; i <= 50; i++) {   // using for loop
        if (i % 2 === 0) {
          sum = sum + i;
        }
      }
      document.getElementById("result").innerText = "Sum = " + sum;
    }
  </script>
</body>
</html>
